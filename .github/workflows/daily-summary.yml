name: Horizon Daily Bilingual Digest

on:
  schedule:
    # GitHub cron is UTC: 00:30 UTC = 08:30 Beijing/Taipei.
    # Scheduled workflows can run later than the planned time.
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: horizon-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check DeepSeek API key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Missing repository secret DEEPSEEK_API_KEY. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Activate personal news configuration
        run: cp data/config.github.json data/config.json

      - name: Generate Chinese and English digests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TZ: Asia/Taipei
        run: uv run horizon --hours 24 --log-level INFO

      - name: Archive daily reports to the main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d docs/_posts ]; then
            git add -f docs/_posts
          fi
          git add docs/feed-en.xml docs/feed-zh.xml
          if ! git diff --cached --quiet; then
            git commit -m "docs: update Horizon daily digest"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
